name: Build & Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: UniversalConverter.exe
            asset: UniversalConverter-Windows.exe
          - os: macos-latest
            artifact: UniversalConverter
            asset: UniversalConverter-macOS
          - os: ubuntu-latest
            artifact: UniversalConverter
            asset: UniversalConverter-Linux

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🐧 Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev

      - name: 🍎 Install system deps (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install python-tk@3.11 || true

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔨 Build with PyInstaller
        run: python build.py

      - name: 📝 Rename artifact
        shell: bash
        run: |
          mv dist/${{ matrix.artifact }} dist/${{ matrix.asset }}

      - name: 📤 Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

      - name: 🚀 Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
